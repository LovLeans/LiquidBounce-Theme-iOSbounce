name: Build

# Builds the theme on every push to main and on pull requests. Two ways to get the compiled theme:
#   1. the run's artifact (Actions tab -> the run -> Artifacts)
#   2. the "Latest build" release, a fixed link that needs no GitHub login:
#      https://github.com/<owner>/<repo>/releases/latest/download/<theme id>.zip
# Both hold a folder named like the theme id (from public/metadata.json), ready to drop into the client's themes folder.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to update the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Package the theme
        run: |
          test -f dist/metadata.json || { echo "::error::dist/metadata.json is missing, the build is incomplete"; exit 1; }
          ID="$(jq -r .id dist/metadata.json)"
          mkdir -p pkg
          cp -r dist "pkg/$ID"
          (cd pkg && zip -r -q "../$ID.zip" "$ID")
          echo "THEME_ID=$ID" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.THEME_ID }}-${{ github.sha }}
          path: pkg
          if-no-files-found: error

      - name: Update the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="$(git rev-parse --short HEAD)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$THEME_ID.zip" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Compiled theme from commit $SHORT. Unzip it into the client's themes folder (open it with \`.client theme browse\`), then run \`.client theme set $THEME_ID\`." \
            --latest
